<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRIVELUX | 404 Not Found</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --main-red: #c8102e; 
            --bg-black: #0a0a0a;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-black);
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .error-code {
            font-size: 10rem;
            font-weight: 800;
            margin: 0;
            color: #1a1a1a; /* Очень темный серый, почти сливается с фоном */
            position: relative;
        }

        .error-code span {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2rem;
            color: white;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 5px;
        }

        h2 {
            margin-top: -20px;
            font-size: 1.5rem;
            color: #888;
            font-weight: 400;
        }

        .back-home {
            margin-top: 40px;
            padding: 15px 40px;
            background-color: var(--main-red);
            color: white;
            text-decoration: none;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 5px;
            transition: 0.3s;
        }

        .back-home:hover {
            background-color: #a00d25;
            box-shadow: 0 0 20px rgba(200, 16, 46, 0.4);
        }

        .car-icon {
            font-size: 3rem;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="car-icon">🏎️💨</div>
    
    <div class="error-code">
        404
        <span>Engine Stalled</span>
    </div>

    <h2>Oops! The page you are looking for has drifted away.</h2>

    <a href="home.html" class="back-home">Back to Home</a>

</body>
</html>
